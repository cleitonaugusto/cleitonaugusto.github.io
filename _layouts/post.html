---
layout: default
---

<div class="container">
  <article>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <div class="meta">
        {{ page.date | date: "%Y-%m-%d" }}
        {% if page.tags %}
          &nbsp;·&nbsp;
          {% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}
        {% endif %}
      </div>
    </header>

    <div class="post-content">
      {{ content }}
    </div>
  </article>
</div>
